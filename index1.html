<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 고기야 포장 RPG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap');

  :root {
    --fire: #ff4500;
    --gold: #ffd700;
    --ember: #ff8c00;
    --dark: #0a0a0f;
    --panel: #12121a;
    --card: #1a1a28;
    --neon-green: #39ff14;
    --neon-blue: #00f5ff;
    --hp-red: #ff2244;
    --exp-purple: #b44fff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanline overlay */
  body::before {
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events:none; z-index:9999;
  }

  /* Ember particles */
  .ember-container {
    position:fixed; inset:0; pointer-events:none; z-index:1;
    overflow:hidden;
  }
  .ember {
    position:absolute;
    width:4px; height:4px;
    border-radius:50%;
    background: var(--ember);
    animation: float-up linear infinite;
    opacity:0;
  }
  @keyframes float-up {
    0%   { transform:translateX(0) translateY(0) scale(1); opacity:0.8; }
    50%  { transform:translateX(var(--dx)) translateY(-50vh) scale(0.6); opacity:0.4; }
    100% { transform:translateX(var(--dx2)) translateY(-100vh) scale(0); opacity:0; }
  }

  /* Header */
  .header {
    text-align:center;
    padding: 24px 16px 16px;
    position:relative; z-index:10;
  }
  .game-title {
    font-family:'Black Han Sans', sans-serif;
    font-size: clamp(28px, 6vw, 52px);
    color: var(--gold);
    text-shadow: 0 0 20px var(--ember), 0 0 40px var(--fire), 2px 2px 0 #4a2000;
    letter-spacing:2px;
    animation: title-pulse 2s ease-in-out infinite;
  }
  @keyframes title-pulse {
    0%,100% { text-shadow: 0 0 20px var(--ember), 0 0 40px var(--fire), 2px 2px 0 #4a2000; }
    50%      { text-shadow: 0 0 40px var(--gold), 0 0 80px var(--ember), 2px 2px 0 #4a2000; }
  }
  .game-subtitle {
    color: var(--ember);
    font-size:13px;
    letter-spacing:4px;
    margin-top:6px;
    text-transform:uppercase;
  }

  /* Stats bar */
  .stats-bar {
    display:flex; gap:12px; padding:12px 16px;
    justify-content:center; flex-wrap:wrap;
    position:relative; z-index:10;
  }
  .stat-box {
    background: var(--card);
    border: 1px solid rgba(255,140,0,0.3);
    border-radius:8px;
    padding:8px 14px;
    min-width:120px;
    text-align:center;
  }
  .stat-label { font-size:10px; color:#888; letter-spacing:2px; text-transform:uppercase; }
  .stat-value { font-family:'Black Han Sans',sans-serif; font-size:20px; color:var(--gold); margin-top:2px; }
  .stat-value.hp { color: var(--hp-red); }
  .stat-value.exp { color: var(--exp-purple); }

  /* EXP bar */
  .exp-bar-wrap {
    padding: 0 16px 12px;
    position:relative; z-index:10;
    max-width:600px; margin:0 auto;
  }
  .exp-bar-label { font-size:11px; color:#888; letter-spacing:2px; margin-bottom:4px; }
  .exp-bar-track {
    height:14px;
    background: rgba(180,79,255,0.15);
    border:1px solid var(--exp-purple);
    border-radius:20px;
    overflow:hidden;
  }
  .exp-bar-fill {
    height:100%;
    background: linear-gradient(90deg, var(--exp-purple), #ff77ff);
    border-radius:20px;
    transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 10px var(--exp-purple);
    width:0%;
  }

  /* HP hearts */
  .hp-hearts {
    display:flex; gap:6px; justify-content:center;
    padding-bottom:12px; z-index:10; position:relative;
  }
  .heart {
    font-size:22px;
    transition: all 0.3s;
    filter: drop-shadow(0 0 6px var(--hp-red));
  }
  .heart.lost { filter:grayscale(1) brightness(0.4); }
  .heart.shake { animation: heart-shake 0.4s; }
  @keyframes heart-shake {
    0%,100% { transform:scale(1); }
    25%  { transform:scale(1.3) rotate(-10deg); }
    50%  { transform:scale(0.8) rotate(5deg); }
    75%  { transform:scale(1.1); }
  }

  /* Main game area */
  .game-area {
    max-width:640px;
    margin:0 auto;
    padding:0 16px 24px;
    position:relative; z-index:10;
  }

  /* Receipt panel */
  .receipt-panel {
    background: linear-gradient(135deg, #1a1200, #0d0d1a);
    border:1px solid var(--gold);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
    box-shadow: 0 0 20px rgba(255,215,0,0.1);
  }
  .receipt-title {
    font-family:'Black Han Sans',sans-serif;
    color:var(--gold); font-size:14px;
    letter-spacing:3px; margin-bottom:10px;
    text-align:center;
  }
  .receipt-item {
    display:flex; justify-content:space-between;
    font-size:13px; color:#ccc;
    padding:3px 0;
    border-bottom:1px dashed rgba(255,215,0,0.1);
  }
  .receipt-item:last-child { border:none; }

  /* Step cards */
  .step-card {
    background: var(--card);
    border:2px solid rgba(255,140,0,0.2);
    border-radius:16px;
    padding:20px;
    margin-bottom:12px;
    cursor:pointer;
    transition: all 0.25s ease;
    position:relative;
    overflow:hidden;
  }
  .step-card::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, transparent 60%, rgba(255,140,0,0.05));
    pointer-events:none;
  }
  .step-card:hover {
    border-color:var(--ember);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,140,0,0.2);
  }
  .step-card.active {
    border-color:var(--gold);
    background: linear-gradient(135deg, #1a1400, #1a1a28);
    box-shadow:0 0 30px rgba(255,215,0,0.2);
  }
  .step-card.done {
    border-color: var(--neon-green);
    background: linear-gradient(135deg, #0a1a0a, #0d1a14);
    opacity:0.85;
  }
  .step-card.fail-card {
    border-color: var(--hp-red);
    background: linear-gradient(135deg, #1a0a0a, #1a0d0d);
    animation: fail-shake 0.5s;
  }
  @keyframes fail-shake {
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(10px);}
    60%{transform:translateX(-8px);}
    80%{transform:translateX(8px);}
  }

  .step-number {
    display:inline-block;
    background: var(--fire);
    color:#fff;
    font-family:'Black Han Sans',sans-serif;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    margin-bottom:10px;
    letter-spacing:1px;
  }
  .step-card.done .step-number { background:var(--neon-green); color:#000; }

  .step-emoji { font-size:28px; margin-right:10px; }
  .step-title {
    font-family:'Black Han Sans',sans-serif;
    font-size:18px; color:#fff;
    display:flex; align-items:center;
  }
  .step-desc {
    font-size:13px; color:#999; margin-top:8px; line-height:1.6;
  }

  /* Items to tap */
  .item-grid {
    display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;
  }
  .item-btn {
    background: rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.15);
    border-radius:12px;
    padding:10px 14px;
    cursor:pointer;
    font-size:13px; color:#ddd;
    display:flex; align-items:center; gap:6px;
    transition: all 0.2s;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .item-btn:hover { border-color:var(--gold); color:#fff; background:rgba(255,215,0,0.08); }
  .item-btn.tapped {
    background: rgba(57,255,20,0.1);
    border-color:var(--neon-green);
    color:var(--neon-green);
    pointer-events:none;
  }
  .item-btn.wrong {
    background: rgba(255,34,68,0.15);
    border-color:var(--hp-red);
    color:var(--hp-red);
    animation: wrong-flash 0.4s;
  }
  @keyframes wrong-flash {
    0%,100%{opacity:1;}50%{opacity:0.3;}
  }

  /* Complete button */
  .complete-btn {
    width:100%;
    background: linear-gradient(135deg, var(--fire), var(--ember));
    border:none; border-radius:14px;
    padding:16px;
    font-family:'Black Han Sans',sans-serif;
    font-size:18px; color:#fff;
    cursor:pointer;
    margin-top:12px;
    letter-spacing:2px;
    box-shadow: 0 4px 20px rgba(255,69,0,0.4);
    transition:all 0.2s;
    position:relative; z-index:10;
  }
  .complete-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,69,0,0.6); }
  .complete-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

  /* Floating effects */
  .float-text {
    position:fixed;
    font-family:'Black Han Sans',sans-serif;
    font-size:22px;
    pointer-events:none;
    z-index:9000;
    animation: float-away 1.4s ease-out forwards;
  }
  @keyframes float-away {
    0%   { transform:translateY(0) scale(0.5); opacity:1; }
    60%  { transform:translateY(-80px) scale(1.1); opacity:1; }
    100% { transform:translateY(-140px) scale(0.8); opacity:0; }
  }

  /* Overlay effects */
  .overlay {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:8000;
    pointer-events:none;
  }
  .exp-popup {
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(24px,5vw,42px);
    color:var(--exp-purple);
    text-shadow:0 0 20px var(--exp-purple), 0 0 40px #ff77ff;
    animation: exp-pop 1.2s ease-out forwards;
    pointer-events:none;
  }
  @keyframes exp-pop {
    0%   { transform:scale(0.3) rotate(-5deg); opacity:0; }
    40%  { transform:scale(1.2) rotate(2deg); opacity:1; }
    70%  { transform:scale(1) rotate(0); opacity:1; }
    100% { transform:scale(0.8) translateY(-40px); opacity:0; }
  }

  /* Perfect screen */
  .perfect-screen {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.92);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:9500;
    animation: fade-in 0.3s;
  }
  @keyframes fade-in { from{opacity:0;} to{opacity:1;} }
  .perfect-title {
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(36px,8vw,72px);
    color:var(--gold);
    text-shadow:0 0 30px var(--gold), 0 0 60px var(--ember);
    animation: perfect-pulse 0.6s ease-in-out infinite alternate;
    text-align:center;
  }
  @keyframes perfect-pulse {
    from{transform:scale(1);} to{transform:scale(1.05);}
  }
  .perfect-sub {
    color:#fff; font-size:18px; margin-top:16px;
    letter-spacing:4px; opacity:0.8;
    text-align:center; padding:0 20px;
  }
  .perfect-stats {
    display:flex; gap:20px; margin-top:30px; flex-wrap:wrap; justify-content:center;
  }
  .pstat {
    background:var(--card);
    border:1px solid var(--gold);
    border-radius:12px;
    padding:14px 22px;
    text-align:center;
  }
  .pstat-label { font-size:11px; color:#888; letter-spacing:2px; }
  .pstat-value { font-family:'Black Han Sans',sans-serif; font-size:28px; color:var(--gold); }
  .restart-btn {
    margin-top:32px;
    background:transparent;
    border:2px solid var(--gold);
    color:var(--gold);
    font-family:'Black Han Sans',sans-serif;
    font-size:16px; letter-spacing:3px;
    padding:14px 36px;
    border-radius:30px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .restart-btn:hover { background:var(--gold); color:#000; }

  /* Confetti */
  .confetti-piece {
    position:fixed;
    width:8px; height:8px;
    pointer-events:none; z-index:9400;
    animation: confetti-fall linear forwards;
    border-radius:2px;
  }
  @keyframes confetti-fall {
    0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
  }

  /* Sound indicator */
  .sound-btn {
    position:fixed; top:16px; right:16px;
    background:var(--card);
    border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-size:18px;
    width:40px; height:40px;
    border-radius:50%;
    cursor:pointer; z-index:200;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s;
  }
  .sound-btn:hover { border-color:var(--gold); }

  /* Combo indicator */
  .combo-display {
    text-align:center;
    font-family:'Black Han Sans',sans-serif;
    font-size:14px;
    color:var(--ember);
    letter-spacing:3px;
    margin-bottom:12px;
    min-height:20px;
    transition:all 0.3s;
    position:relative; z-index:10;
  }
  .combo-display.active { color:var(--gold); text-shadow:0 0 10px var(--gold); }

  /* Step progress */
  .step-progress {
    display:flex; gap:6px; justify-content:center;
    margin-bottom:16px; flex-wrap:wrap;
    position:relative; z-index:10;
  }
  .step-dot {
    width:28px; height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:1.5px solid rgba(255,255,255,0.2);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#888;
    font-family:'Black Han Sans',sans-serif;
    transition:all 0.3s;
  }
  .step-dot.done { background:var(--neon-green); border-color:var(--neon-green); color:#000; }
  .step-dot.active { background:var(--ember); border-color:var(--gold); color:#fff; box-shadow:0 0 10px var(--ember); }

  /* Box animation */
  .box-preview {
    text-align:center;
    font-size:32px;
    padding:12px;
    letter-spacing:4px;
    position:relative; z-index:10;
    min-height:60px;
  }
  .box-item {
    display:inline-block;
    animation: drop-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes drop-in {
    from{transform:translateY(-30px) scale(0.3);opacity:0;}
    to{transform:translateY(0) scale(1);opacity:1;}
  }

  /* Fail screen */
  .fail-screen {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.9);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:9500;
  }
  .fail-title {
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(48px,10vw,80px);
    color:var(--hp-red);
    text-shadow:0 0 30px var(--hp-red);
    animation:fail-pulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes fail-pulse { from{transform:scale(1);}to{transform:scale(1.04);} }
  .fail-sub { color:#aaa; font-size:16px; margin-top:12px; text-align:center; padding:0 20px; }
</style>
</head>
<body>

<!-- Ember particles -->
<div class="ember-container" id="emberContainer"></div>

<!-- Sound toggle -->
<button class="sound-btn" id="soundBtn" onclick="toggleSound()" title="사운드">🔊</button>

<!-- Header -->
<div class="header">
  <div class="game-title">🔥 고기야 포장 RPG</div>
  <div class="game-subtitle">CHARCOAL PACKING MASTER SYSTEM v2.0</div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-box">
    <div class="stat-label">LEVEL</div>
    <div class="stat-value" id="levelVal">1</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">EXP</div>
    <div class="stat-value exp" id="expVal">0 / 100</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">COMBO</div>
    <div class="stat-value" id="comboVal" style="color:var(--ember)">×0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">SCORE</div>
    <div class="stat-value" id="scoreVal">0</div>
  </div>
</div>

<!-- EXP bar -->
<div class="exp-bar-wrap">
  <div class="exp-bar-label">EXP ─────────────────────</div>
  <div class="exp-bar-track">
    <div class="exp-bar-fill" id="expBar"></div>
  </div>
</div>

<!-- HP hearts -->
<div class="hp-hearts" id="hearts"></div>

<!-- Combo display -->
<div class="combo-display" id="comboDisplay"></div>

<!-- Step progress dots -->
<div class="step-progress" id="stepProgress"></div>

<!-- Box preview (items added) -->
<div class="box-preview" id="boxPreview"></div>

<!-- Game area -->
<div class="game-area" id="gameArea"></div>

<script>
// ═══════════════════════════════════════════════
// AUDIO ENGINE (Web Audio API)
// ═══════════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx = null;
let soundOn = true;

function ensureCtx() {
  if (!ctx) ctx = new AudioCtx();
  return ctx;
}
function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
}

function playTone(freq, type, duration, gain=0.3) {
  if (!soundOn) return;
  try {
    const c = ensureCtx();
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(gain, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
    osc.start(c.currentTime);
    osc.stop(c.currentTime + duration);
  } catch(e) {}
}

function playSuccess() {
  playTone(523, 'square', 0.08, 0.2);
  setTimeout(() => playTone(659, 'square', 0.08, 0.2), 80);
  setTimeout(() => playTone(784, 'square', 0.15, 0.3), 160);
}
function playPerfect() {
  [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>playTone(f,'square',0.18,0.25),i*70));
}
function playFail() {
  playTone(330, 'sawtooth', 0.12, 0.3);
  setTimeout(() => playTone(220, 'sawtooth', 0.2, 0.4), 100);
}
function playTap() {
  playTone(880, 'sine', 0.06, 0.15);
}
function playWrong() {
  playTone(180, 'sawtooth', 0.15, 0.3);
}
function playItemAdd() {
  const freqs = [440,494,523,587,659];
  playTone(freqs[Math.floor(Math.random()*freqs.length)], 'sine', 0.1, 0.2);
}
function playBeep() {
  // 삐용 sound
  if (!soundOn) return;
  try {
    const c = ensureCtx();
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, c.currentTime);
    osc.frequency.linearRampToValueAtTime(400, c.currentTime + 0.3);
    g.gain.setValueAtTime(0.3, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.3);
    osc.start(); osc.stop(c.currentTime + 0.3);
  } catch(e) {}
}

// ═══════════════════════════════════════════════
// VIBRATION
// ═══════════════════════════════════════════════
function vib(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ═══════════════════════════════════════════════
// GAME DATA
// ═══════════════════════════════════════════════
const STEPS = [
  {
    id:1,
    icon:'📄',
    title:'영수증 확인',
    desc:'오더렉 영수증을 확인하고 품목과 수량을 체크하세요!',
    items:[
      { emoji:'📄', label:'영수증 스캔', correct:true },
      { emoji:'🧾', label:'수량 체크확인', correct:true },
      { emoji:'💬', label:'영수증 정리', correct:true },
      { emoji:'❌', label:'체크 안하기', correct:true },
    ],
    requiredCorrect: 3,
    packEmoji: '📄',
  },
  {
    id:2,
    icon:'📦',
    title:'봉투 준비 + 된장찌개/고기 & 공기밥 먼저!!!',
    desc:'🚨 중요! 봉투 바닥에 뜨거운 된장찌개 + 공기밥을 가장 먼저 넣으세요!',
    items:[
      { emoji:'🍲', label:'공기밥 넣기', correct:true },
      { emoji:'🍚', label:'된장찌개 넣기', correct:true },
      { emoji:'🍱', label:'고기 넣기(수량확인)', correct:false },
      { emoji:'❌', label:'위치 다르게 하기', correct:true },
    ],
    requiredCorrect: 3,
    packEmoji: '🍲🍚',
  },
  {
    id:3,
    icon:'🥩',
    title:'숯불고기 + 소금 + 쌈장',
    desc:'숯불고기를 담고 소금과 쌈장을 함께 넣어주세요.',
    items:[

      { emoji:'📐', label:'각잡기', correct:true },

// ═══════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════
let state = {
  hp: 3,
  exp: 0,
  level: 1,
  score: 0,
  combo: 0,
  maxCombo: 0,
  currentStep: 0,
  stepsDone: 0,
  tappedItems: {},     // stepId -> Set of tapped correct items
  wrongItems: {},      // stepId -> Set of wrong tapped
  stepComplete: {},    // stepId -> bool
  packItems: [],       // emojis added to box
  startTime: Date.now(),
  totalSteps: STEPS.length,
};

// ═══════════════════════════════════════════════
// EMBER PARTICLES
// ═══════════════════════════════════════════════
function spawnEmbers() {
  const container = document.getElementById('emberContainer');
  for (let i=0; i<15; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    const x = Math.random()*100;
    const delay = Math.random()*6;
    const dur = 4 + Math.random()*4;
    const dx = (Math.random()-0.5)*100;
    const dx2 = (Math.random()-0.5)*150;
    e.style.cssText = `
      left:${x}%;
      bottom:-10px;
      --dx:${dx}px; --dx2:${dx2}px;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      background:${Math.random()>0.5?'#ff8c00':'#ffd700'};
      width:${2+Math.random()*4}px;
      height:${2+Math.random()*4}px;
    `;
    container.appendChild(e);
  }
}

// ═══════════════════════════════════════════════
// FLOAT TEXT
// ═══════════════════════════════════════════════
function spawnFloat(text, color, x, y) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.cssText = `color:${color};left:${x}px;top:${y}px;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ═══════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════
function spawnConfetti(count=60) {
  const colors = ['#ff4500','#ffd700','#ff8c00','#39ff14','#00f5ff','#ff77ff','#fff'];
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

// ═══════════════════════════════════════════════
// RENDER HEARTS
// ═══════════════════════════════════════════════
function renderHearts() {
  const el = document.getElementById('hearts');
  el.innerHTML = '';
  for (let i=0; i<3; i++){
    const h = document.createElement('div');
    h.className = 'heart' + (i >= state.hp ? ' lost' : '');
    h.textContent = '❤️';
    el.appendChild(h);
  }
}

// ═══════════════════════════════════════════════
// RENDER STATS
// ═══════════════════════════════════════════════
function renderStats() {
  const expNeeded = state.level * 100;
  document.getElementById('levelVal').textContent = state.level;
  document.getElementById('expVal').textContent = `${state.exp % expNeeded} / ${expNeeded}`;
  document.getElementById('comboVal').textContent = `×${state.combo}`;
  document.getElementById('scoreVal').textContent = state.score;
  document.getElementById('expBar').style.width = ((state.exp % expNeeded) / expNeeded * 100) + '%';

  const cd = document.getElementById('comboDisplay');
  if (state.combo >= 3) {
    cd.textContent = `🔥 ${state.combo} COMBO!!`;
    cd.className = 'combo-display active';
  } else if (state.combo > 0) {
    cd.textContent = `⚡ ${state.combo} COMBO`;
    cd.className = 'combo-display';
  } else {
    cd.textContent = '';
    cd.className = 'combo-display';
  }
}

// ═══════════════════════════════════════════════
// RENDER STEP PROGRESS DOTS
// ═══════════════════════════════════════════════
function renderProgress() {
  const el = document.getElementById('stepProgress');
  el.innerHTML = '';
  STEPS.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'step-dot' + (state.stepComplete[s.id]?' done':'') + (i===state.currentStep&&!state.stepComplete[s.id]?' active':'');
    d.textContent = state.stepComplete[s.id] ? '✓' : (i+1);
    el.appendChild(d);
  });
}

// ═══════════════════════════════════════════════
// RENDER BOX PREVIEW
// ═══════════════════════════════════════════════
function renderBoxPreview() {
  const el = document.getElementById('boxPreview');
  el.innerHTML = state.packItems.map((e,i)=>
    `<span class="box-item" style="animation-delay:${i*0.05}s">${e}</span>`
  ).join(' ');
}

// ═══════════════════════════════════════════════
// RENDER GAME STEPS
// ═══════════════════════════════════════════════
function renderGame() {
  renderHearts();
  renderStats();
  renderProgress();
  renderBoxPreview();

  const area = document.getElementById('gameArea');
  area.innerHTML = '';

  if (state.currentStep >= STEPS.length) {
    triggerPerfect();
    return;
  }

  const step = STEPS[state.currentStep];
  const tapped = state.tappedItems[step.id] || new Set();
  const wrong = state.wrongItems[step.id] || new Set();

  const card = document.createElement('div');
  card.className = 'step-card active';
  card.id = 'currentCard';

  card.innerHTML = `
    <div class="step-number">STEP ${step.id} / ${STEPS.length}</div>
    <div class="step-title">
      <span class="step-emoji">${step.icon}</span>
      ${step.title}
    </div>
    <div class="step-desc">${step.desc}</div>
    <div class="item-grid" id="itemGrid"></div>
    <div id="stepStatus" style="margin-top:12px;font-size:13px;color:#888;text-align:center;"></div>
  `;
  area.appendChild(card);

  const grid = document.getElementById('itemGrid');
  step.items.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'item-btn' + 
      (tapped.has(idx) ? ' tapped' : '') +
      (wrong.has(idx) ? ' wrong' : '');
    btn.innerHTML = `${item.emoji} ${item.label}`;
    btn.onclick = () => tapItem(step.id, idx, item.correct, btn, step);
    grid.appendChild(btn);
  });

  updateStepStatus(step, tapped);

  // Also render completed steps above (briefly)
  if (state.stepsDone > 0) {
    const doneSection = document.createElement('div');
    doneSection.style.marginTop = '16px';
    for (let i = Math.max(0, state.currentStep-2); i < state.currentStep; i++) {
      const ds = STEPS[i];
      const dc = document.createElement('div');
      dc.className = 'step-card done';
      dc.innerHTML = `<div class="step-number">STEP ${ds.id} ✓</div>
        <div class="step-title"><span class="step-emoji">${ds.icon}</span>${ds.title} <span style="color:var(--neon-green);margin-left:auto">✅ CLEAR</span></div>`;
      doneSection.appendChild(dc);
    }
    area.insertBefore(doneSection, card);
  }
}

// ═══════════════════════════════════════════════
// UPDATE STATUS TEXT
// ═══════════════════════════════════════════════
function updateStepStatus(step, tapped) {
  const status = document.getElementById('stepStatus');
  if (!status) return;
  const correctTapped = [...(state.tappedItems[step.id]||new Set())].filter(i=>step.items[i].correct).length;
  status.textContent = `진행도: ${correctTapped} / ${step.requiredCorrect} ─ ${correctTapped>=step.requiredCorrect?'다음 단계 준비!':'항목을 탭하세요!'}`;
  if (correctTapped >= step.requiredCorrect) {
    status.style.color = 'var(--neon-green)';
    // Auto advance after a moment if all done
    completeStep(step);
  }
}

// ═══════════════════════════════════════════════
// TAP ITEM
// ═══════════════════════════════════════════════
function tapItem(stepId, idx, correct, btn, step) {
  if (!state.tappedItems[stepId]) state.tappedItems[stepId] = new Set();
  if (!state.wrongItems[stepId]) state.wrongItems[stepId] = new Set();

  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  playTap();

  if (state.tappedItems[stepId].has(idx) || state.wrongItems[stepId].has(idx)) return;

  if (correct) {
    state.tappedItems[stepId].add(idx);
    btn.classList.add('tapped');
    playItemAdd();
    vib([30]);

    // Combo
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;

    // EXP & Score
    const comboBonus = Math.floor(state.combo * 1.5);
    const gained = 10 + comboBonus;
    state.exp += gained;
    state.score += gained * 10;

    // Level up check
    const expNeeded = state.level * 100;
    if (state.exp >= state.level * 100) {
      state.level++;
      spawnFloat('⬆️ LEVEL UP!', 'var(--gold)', cx - 40, cy - 20);
      vib([50, 30, 50]);
      playPerfect();
    }

    spawnFloat(`+${gained} EXP`, 'var(--exp-purple)', cx - 20, cy - 20);
    if (state.combo >= 3) spawnFloat(`🔥 ${state.combo}COMBO!`, 'var(--ember)', cx - 30, cy - 50);

    // EXP popup
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const popup = document.createElement('div');
    popup.className = 'exp-popup';
    popup.textContent = `✨ +${gained} EXP`;
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 1300);

    renderStats();
    renderProgress();

    // Check completion
    const correctTapped = [...state.tappedItems[stepId]].filter(i=>step.items[i].correct).length;
    if (correctTapped >= step.requiredCorrect) {
      setTimeout(() => completeStep(step), 400);
    }
  } else {
    // Wrong item
    state.wrongItems[stepId].add(idx);
    btn.classList.add('wrong');
    playWrong();
    vib([100]);
    state.combo = 0;
    state.hp--;

    spawnFloat('❌ FAIL!', 'var(--hp-red)', cx - 20, cy - 20);

    // Shake card
    const card = document.getElementById('currentCard');
    if (card) { card.classList.add('fail-card'); setTimeout(()=>card.classList.remove('fail-card'),600); }

    // Shake heart
    const hearts = document.querySelectorAll('.heart');
    if (hearts[state.hp]) {
      hearts[state.hp].classList.add('shake');
      setTimeout(() => hearts[state.hp].classList.remove('shake'), 500);
    }

    renderHearts();
    renderStats();

    if (state.hp <= 0) {
      setTimeout(() => triggerFail(), 600);
    }
  }
}

// ═══════════════════════════════════════════════
// COMPLETE STEP
// ═══════════════════════════════════════════════
function completeStep(step) {
  if (state.stepComplete[step.id]) return;
  state.stepComplete[step.id] = true;
  state.stepsDone++;

  playBeep();
  playSuccess();
  vib([50, 30, 80]);
  spawnConfetti(20);

  // Add to box
  step.packEmoji.split('').filter(c=>c.trim()).forEach(e => state.packItems.push(e));
  renderBoxPreview();

  // Float text
  spawnFloat('📦 STEP CLEAR!', 'var(--neon-green)', window.innerWidth/2 - 60, window.innerHeight/2);

  setTimeout(() => {
    state.currentStep++;
    if (state.currentStep >= STEPS.length) {
      triggerPerfect();
    } else {
      renderGame();
    }
  }, 900);
}

// ═══════════════════════════════════════════════
// PERFECT ENDING
// ═══════════════════════════════════════════════
function triggerPerfect() {
  playPerfect();
  spawnConfetti(100);
  vib([100,50,100,50,200]);

  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  const mm = Math.floor(elapsed/60).toString().padStart(2,'0');
  const ss = (elapsed%60).toString().padStart(2,'0');

  const screen = document.createElement('div');
  screen.className = 'perfect-screen';
  screen.innerHTML = `
    <div style="font-size:72px;margin-bottom:8px;animation:title-pulse 0.5s infinite alternate">📦</div>
    <div class="perfect-title">⭐ PERFECT PACKING ⭐</div>
    <div class="perfect-sub">포장 마스터 달성! 고객이 기뻐합니다 🎉</div>
    <div class="perfect-stats">
      <div class="pstat"><div class="pstat-label">LEVEL</div><div class="pstat-value">${state.level}</div></div>
      <div class="pstat"><div class="pstat-label">SCORE</div><div class="pstat-value">${state.score}</div></div>
      <div class="pstat"><div class="pstat-label">MAX COMBO</div><div class="pstat-value">×${state.maxCombo}</div></div>
      <div class="pstat"><div class="pstat-label">TIME</div><div class="pstat-value">${mm}:${ss}</div></div>
      <div class="pstat"><div class="pstat-label">HP LEFT</div><div class="pstat-value">${'❤️'.repeat(state.hp)}</div></div>
    </div>
    <div style="font-size:42px;margin-top:20px;">🦀💳📦✅📄🔥</div>
    <button class="restart-btn" onclick="restartGame()">▶ 다시 포장하기</button>
  `;
  document.body.appendChild(screen);

  // Keep confetti raining
  let confettiInterval = setInterval(() => spawnConfetti(15), 1500);
  screen.dataset.intervalId = confettiInterval;
}

// ═══════════════════════════════════════════════
// FAIL SCREEN
// ═══════════════════════════════════════════════
function triggerFail() {
  playFail();
  vib([200, 100, 200]);

  const screen = document.createElement('div');
  screen.className = 'fail-screen';
  screen.innerHTML = `
    <div style="font-size:64px">💔</div>
    <div class="fail-title">GAME OVER</div>
    <div class="fail-sub">하트가 모두 소진됐습니다.<br>포장 순서를 다시 확인해보세요!</div>
    <div style="font-size:28px;margin-top:20px">📦❌</div>
    <button class="restart-btn" style="margin-top:24px;" onclick="restartGame()">▶ 다시 도전</button>
  `;
  document.body.appendChild(screen);
}

// ═══════════════════════════════════════════════
// RESTART
// ═══════════════════════════════════════════════
function restartGame() {
  // Clear intervals on perfect screen
  document.querySelectorAll('.perfect-screen, .fail-screen').forEach(s => {
    if (s.dataset.intervalId) clearInterval(parseInt(s.dataset.intervalId));
    s.remove();
  });

  state = {
    hp: 3, exp: 0, level: 1, score: 0,
    combo: 0, maxCombo: 0,
    currentStep: 0, stepsDone: 0,
    tappedItems: {}, wrongItems: {},
    stepComplete: {}, packItems: [],
    startTime: Date.now(),
    totalSteps: STEPS.length,
  };
  renderGame();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
spawnEmbers();
renderGame();

// Touch to init audio context
document.body.addEventListener('touchstart', () => ensureCtx(), { once: true });
document.body.addEventListener('click', () => ensureCtx(), { once: true });
</script>
