<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>최우영고기야 포장 테트리스</title>
<style>
:root{--glow:#00fff0;--bg:#020617;--panel:#07111f;--cell:34px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
body{height:100dvh;background:radial-gradient(circle at 50% 0%,#05283a 0%,#020617 42%,#000 100%);color:#fff;overflow:hidden;}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:6px;padding:8px;max-width:520px;margin:0 auto;}
header{text-align:center;line-height:1.2;padding-top:2px;}
header h1{font-size:20px;color:#00ffe7;text-shadow:0 0 12px #00ffe7;font-weight:900;letter-spacing:.05em;}
header p{font-size:12px;color:#ff36d8;text-shadow:0 0 8px #ff36d8;font-weight:800;margin-top:3px;}
.main{display:grid;grid-template-columns:1fr 105px;gap:7px;min-height:0;}
#board{position:relative;height:100%;min-height:0;border:3px solid var(--glow);border-radius:10px;overflow:hidden;background:linear-gradient(rgba(0,255,240,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,240,.09) 1px,transparent 1px),linear-gradient(180deg,rgba(20,0,35,.9),rgba(0,18,35,.9));background-size:var(--cell) var(--cell);box-shadow:0 0 20px var(--glow),inset 0 0 25px rgba(0,255,240,.18);}
.layer{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,255,255,.18);pointer-events:none;}
.layer span{position:absolute;right:8px;top:5px;color:rgba(255,255,255,.15);font-size:18px;font-weight:900;}
.target{position:absolute;border:2px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.04);border-radius:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:12px;font-weight:900;text-align:center;padding:2px;}
.target.active{border-color:#ffea00;background:rgba(255,234,0,.16);box-shadow:0 0 18px rgba(255,234,0,.75);}
.target.done{border-color:rgba(0,255,140,.5);background:rgba(0,255,140,.08);color:rgba(0,255,140,.75);}
.block{position:absolute;border-radius:11px;background-size:cover;background-position:center;background-repeat:no-repeat;border:2px solid rgba(255,255,255,.32);box-shadow:0 8px 16px rgba(0,0,0,.45),0 0 13px rgba(255,255,255,.2);transition:left .08s linear,top .08s linear,transform .14s;z-index:20;cursor:grab;}
.block::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.18),transparent 45%,rgba(0,0,0,.2));pointer-events:none;}
.block.placed{box-shadow:0 0 13px rgba(0,255,160,.7);z-index:10;}
.block.fail{animation:shake .28s;box-shadow:0 0 22px #ff1744;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-8px)}}
.side{display:flex;flex-direction:column;gap:7px;min-width:0;}
.card{border:1px solid rgba(0,255,240,.35);background:rgba(3,15,28,.85);box-shadow:0 0 10px rgba(0,255,240,.16);border-radius:12px;padding:8px;text-align:center;}
.card b{display:block;font-size:10px;color:#00ffe7;letter-spacing:.22em;margin-bottom:4px;}
.card strong{font-size:25px;color:#fff200;text-shadow:0 0 12px #fff200;}
.guide{text-align:left;font-size:11px;line-height:1.52;}
.guide li{display:block;border-radius:8px;padding:4px 3px;}
.guide img{display:none;}
.block .blockLabel{position:absolute;left:5px;bottom:4px;right:5px;text-align:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 0 5px #000,0 1px 2px #000;background:rgba(0,0,0,.28);border-radius:7px;padding:2px;}
.target::before{content:'';position:absolute;inset:4px;background-image:var(--target-img);background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.18;filter:grayscale(1);}
.target{overflow:hidden;}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:150;}
.bgmBadge{position:absolute;left:8px;top:8px;z-index:160;background:rgba(0,0,0,.45);border:1px solid rgba(0,255,240,.45);color:#00ffe7;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;box-shadow:0 0 12px rgba(0,255,240,.35);}
.starFlash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff200;text-shadow:0 0 12px #fff200,0 0 28px #ff2cff;z-index:155;pointer-events:none;animation:flashUp .85s ease-out forwards;}
@keyframes flashUp{0%{opacity:0;transform:translate(-50%,-40%) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-85%) scale(1.25)}}
.guide li{list-style:none;opacity:.55;margin:2px 0;}
.guide li.done{opacity:1;color:#00ff85;}
.guide li.current{opacity:1;color:#ffea00;text-shadow:0 0 8px #ffea00;font-weight:900;}
.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding-bottom:calc(4px + env(safe-area-inset-bottom));}
.btn{height:56px;border:0;border-radius:50%;font-size:22px;font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.14);touch-action:manipulation;}
.btn:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.35);}
.pause{background:linear-gradient(#555,#222)}.left,.right{background:linear-gradient(#35df4d,#087c28)}.down{background:linear-gradient(#21c8ff,#0066d8)}.drop{background:linear-gradient(#ff2cff,#7c0096);font-size:15px;}.auto{background:linear-gradient(#ffd23a,#b96a00);font-size:15px;}
.notice{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);border:2px solid #fff;border-radius:16px;padding:16px;text-align:center;z-index:100;display:none;min-width:230px;box-shadow:0 0 30px rgba(255,255,255,.4);}
.notice.show{display:block;animation:pop .25s;}.notice h2{font-size:26px;color:#ffea00;margin-bottom:8px}.notice p{font-size:14px;line-height:1.45}@keyframes pop{from{transform:translate(-50%,-50%) scale(.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);z-index:200;text-align:center;padding:20px;}
.start h2{font-size:26px;color:#00ffe7;text-shadow:0 0 15px #00ffe7;margin-bottom:10px}.start p{font-size:14px;line-height:1.7;color:#ddd;margin-bottom:20px}.start button{border:0;border-radius:14px;padding:14px 28px;background:#ff2cff;color:white;font-weight:900;font-size:18px;box-shadow:0 0 20px #ff2cff;touch-action:manipulation;}
@media(max-width:430px){.app{padding:7px}.main{grid-template-columns:1fr 96px}.btn{height:52px}.card{padding:7px}header h1{font-size:19px}.guide{font-size:10.5px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🎮 포장 테트리스</h1><p>최우영 고기야 · 포장 교육 게임</p></header>
<div class="main">
  <div id="board">
    <canvas id="fxCanvas"></canvas>
    <div id="bgmBadge" class="bgmBadge">♪ BGM ON</div>
    <div class="layer" style="top:75%"><span>바닥①</span></div>
    <div class="layer" style="top:55%"><span>하단②</span></div>
    <div class="layer" style="top:35%"><span>중간③</span></div>
    <div class="layer" style="top:15%"><span>가장위④</span></div>
    <div id="notice" class="notice"><h2 id="noticeTitle"></h2><p id="noticeText"></p></div>
    <div id="start" class="start"><h2>포장 위치 맞추기</h2><p>품목 이미지가 들어간 블럭을<br>정해진 위치에 맞춰 넣으세요.<br><b>순서와 위치가 맞아야 고정됩니다.</b></p><button id="startBtn">PRESS START</button></div>
  </div>
  <aside class="side">
    <div class="card"><b>SCORE</b><strong id="score">0</strong></div>
    <div class="card"><b>LEVEL</b><strong>1</strong></div>
    <div class="card"><b>COMBO</b><strong id="combo">0</strong></div>
    <div class="card guide"><b>포장 순서</b><ul id="stepList"></ul></div>
  </aside>
</div>
<div class="controls">
  <button class="btn pause" id="resetBtn">↺</button>
  <button class="btn left" id="leftBtn">←</button>
  <button class="btn down" id="upBtn">↑</button>
  <button class="btn down" id="downBtn">↓</button>
  <button class="btn right" id="rightBtn">→</button>
  <button class="btn drop" id="dropBtn">DROP</button>
</div>
</div>
<script>
const COLS=8, ROWS=16;
let CELL=34;
const board=document.getElementById('board');
const fxCanvas=document.getElementById('fxCanvas');
const fx=fxCanvas.getContext('2d');
let particles=[];
let audioCtx=null, bgmTimer=null, musicOn=true;
const notice=document.getElementById('notice');
const title=document.getElementById('noticeTitle');
const text=document.getElementById('noticeText');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const stepList=document.getElementById('stepList');
const blocks=[
 {id:'doenjang', name:'된장찌개', file:'a1.png', x:0, y:14, w:5, h:2, note:'바닥 왼쪽. 가장 먼저 넣기'},
 {id:'rice', name:'공기밥', file:'a2.png', x:6, y:14, w:2, h:2, note:'된장찌개 오른쪽'},
 {id:'meat', name:'숯불고기', file:'a3.png', x:0, y:10, w:5, h:2, note:'된장찌개 바로 위'},
 {id:'ssamjang', name:'쌈장 소스컵', file:'a4.png', x:6, y:10, w:1, h:1, note:'고기 옆 소스컵 위'},
 {id:'saltpepper', name:'소금후추 소스컵', file:'a5.png', x:6, y:11, w:1, h:1, note:'쌈장 아래'},
 {id:'side', name:'4칸반찬', file:'a6.png', x:0, y:6, w:4, h:2, note:'하단 위쪽'},
 {id:'veg', name:'야채팩', file:'a7.png', x:5, y:5, w:2, h:3, note:'4칸반찬 옆에 세워 넣기'},
 {id:'gejang', name:'리뷰게장+명함', file:'a8.png', x:0, y:1, w:6, h:2, note:'가장 위. 명함 꼭 확인'}
];
let current=0, active=null, score=0, combo=0, started=false, drag=null;
function fitCell(){
  const r=board.getBoundingClientRect();
  CELL=Math.floor(Math.min(r.width/COLS, r.height/ROWS));
  CELL=Math.max(24, CELL);
  document.documentElement.style.setProperty('--cell', CELL+'px');
  renderAll();
}
function px(v){return (v*CELL)+'px'}
function renderTargets(){
  document.querySelectorAll('.target').forEach(e=>e.remove());
  blocks.forEach((b,i)=>{
    const t=document.createElement('div');
    t.className='target'+(i===current?' active':'')+(i<current?' done':'');
    t.style.left=px(b.x); t.style.top=px(b.y); t.style.width=px(b.w); t.style.height=px(b.h);
    t.style.setProperty('--target-img', `url('${b.file}')`);
    t.textContent=i<current?'✓':b.name;
    board.appendChild(t);
  });
}
function renderSteps(){
 stepList.innerHTML='';
 blocks.forEach((b,i)=>{
  const li=document.createElement('li');
  li.className=i<current?'done':i===current?'current':'';
  const img=document.createElement('img');
  img.src=b.file;
  const span=document.createElement('span');
  span.textContent=`${i+1}. ${b.name}`;
  li.appendChild(img);
  li.appendChild(span);
  stepList.appendChild(li);
 });
}
function renderAll(){renderTargets(); renderSteps(); if(active){sizeActive(); updateActive();}}
function sizeActive(){if(!active)return; const b=blocks[current]; active.style.width=px(b.w); active.style.height=px(b.h);}
function spawn(){
 if(active) active.remove();
 renderTargets(); renderSteps();
 if(current>=blocks.length){show('PERFECT!', '같은 순서 · 같은 위치 · 마지막 검수 완료'); navigator.vibrate?.([180,80,180,80,220]); victorySound(); cosmicFireworks(70); flashText('우주 폭죽 퍼레이드!'); return;}
 const b=blocks[current];
 active=document.createElement('div'); active.className='block'; active.dataset.x=Math.max(0,Math.floor((COLS-b.w)/2)); active.dataset.y=0;
 active.style.backgroundImage=`url('${b.file}')`;
 const label=document.createElement('div'); label.className='blockLabel'; label.textContent=b.name; active.appendChild(label);
 board.appendChild(active); sizeActive(); updateActive();
 bindDrag(active);
 show('다음 블럭', `${b.name}<br>${b.note}`, 700);
}
function updateActive(){ if(!active)return; active.style.left=px(+active.dataset.x); active.style.top=px(+active.dataset.y); }
function move(dx,dy){ if(!active)return; const b=blocks[current]; let nx=+active.dataset.x+dx, ny=+active.dataset.y+dy; nx=Math.max(0,Math.min(COLS-b.w,nx)); ny=Math.max(0,Math.min(ROWS-b.h,ny)); active.dataset.x=nx; active.dataset.y=ny; updateActive(); }
function snapToTarget(){ if(!active)return; const b=blocks[current]; active.dataset.x=b.x; active.dataset.y=b.y; updateActive(); }
function place(){
 if(!active)return; const b=blocks[current]; const ax=+active.dataset.x, ay=+active.dataset.y;
 if(ax===b.x && ay===b.y){
   active.classList.add('placed'); active=null; current++; combo++; score+=10+combo*2; scoreEl.textContent=score; comboEl.textContent=combo; navigator.vibrate?.([80,35,120]); successSound(); cosmicFireworks(); flashText('딸깍! PERFECT'); setTimeout(spawn,260);
 }else{combo=0; comboEl.textContent=combo; active.classList.add('fail'); navigator.vibrate?.([100,40,100]); show('위치 오류', '노란 그림자 위치에 맞춘 뒤 DROP을 누르세요.', 750); setTimeout(()=>active?.classList.remove('fail'),300);}
}
function show(t,m,ms){title.innerHTML=t;text.innerHTML=m;notice.classList.add('show'); if(ms) setTimeout(()=>notice.classList.remove('show'),ms);}
function startGame(){if(started)return; started=true; document.getElementById('start').style.display='none'; startBgm(); resizeFx(); fitCell(); spawn();}
function resetGame(){current=0; score=0; combo=0; scoreEl.textContent=0; comboEl.textContent=0; document.querySelectorAll('.block').forEach(e=>e.remove()); active=null; if(!started) return; spawn();}

function resizeFx(){
  const r=board.getBoundingClientRect();
  fxCanvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));
  fxCanvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));
  fxCanvas.style.width=r.width+'px'; fxCanvas.style.height=r.height+'px';
  fx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function makeTone(freq,dur,type='square',gain=.04,delay=0){
  if(!audioCtx||!musicOn)return;
  const now=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,now);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(gain,now+.015);
  g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+.02);
}
function startBgm(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const notes=[262,330,392,523,392,330,294,392];
  let i=0;
  bgmTimer=setInterval(()=>{
    if(!musicOn)return;
    makeTone(notes[i%notes.length],.11,'square',.018,0);
    makeTone(notes[(i+2)%notes.length]/2,.16,'triangle',.012,.02);
    i++;
  },210);
}
function successSound(){ makeTone(660,.08,'square',.045); makeTone(990,.12,'square',.04,.08); makeTone(1320,.14,'triangle',.035,.16); }
function victorySound(){ [523,659,784,1046,1318].forEach((n,i)=>makeTone(n,.16,'square',.05,i*.1)); }
function cosmicFireworks(count=36){
  resizeFx();
  const r=board.getBoundingClientRect();
  const colors=['#00fff0','#fff200','#ff2cff','#7cff00','#00a3ff','#ff7a00'];
  for(let j=0;j<count;j++){
    const x=r.width*(.25+Math.random()*.5); const y=r.height*(.15+Math.random()*.55);
    for(let k=0;k<12;k++){
      const a=Math.random()*Math.PI*2; const sp=1.2+Math.random()*3.2;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.2,life:45+Math.random()*35,size:2+Math.random()*3,color:colors[(Math.random()*colors.length)|0]});
    }
  }
  animateFx();
}
let fxRunning=false;
function animateFx(){
  if(fxRunning)return; fxRunning=true;
  const loop=()=>{
    fx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.045; p.life--;
      fx.globalAlpha=Math.max(0,p.life/70);
      fx.fillStyle=p.color; fx.shadowBlur=12; fx.shadowColor=p.color;
      fx.beginPath(); fx.arc(p.x,p.y,p.size,0,Math.PI*2); fx.fill();
    });
    fx.globalAlpha=1; fx.shadowBlur=0;
    if(particles.length) requestAnimationFrame(loop); else {fx.clearRect(0,0,fxCanvas.width,fxCanvas.height); fxRunning=false;}
  };
  requestAnimationFrame(loop);
}
function flashText(msg){
  const d=document.createElement('div'); d.className='starFlash'; d.textContent=msg; board.appendChild(d);
  setTimeout(()=>d.remove(),900);
}

function bindBtn(id,fn){const el=document.getElementById(id); ['click','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault(); fn();},{passive:false}));}
bindBtn('startBtn', startGame); bindBtn('resetBtn', resetGame); bindBtn('leftBtn', ()=>move(-1,0)); bindBtn('rightBtn', ()=>move(1,0)); bindBtn('upBtn', ()=>move(0,-1)); bindBtn('downBtn', ()=>move(0,1)); bindBtn('dropBtn', place);
function bindDrag(el){
 el.addEventListener('pointerdown',e=>{drag={sx:e.clientX,sy:e.clientY,ox:+el.dataset.x,oy:+el.dataset.y}; el.setPointerCapture(e.pointerId);});
 el.addEventListener('pointermove',e=>{if(!drag)return; const b=blocks[current]; let nx=drag.ox+Math.round((e.clientX-drag.sx)/CELL); let ny=drag.oy+Math.round((e.clientY-drag.sy)/CELL); nx=Math.max(0,Math.min(COLS-b.w,nx)); ny=Math.max(0,Math.min(ROWS-b.h,ny)); el.dataset.x=nx; el.dataset.y=ny; updateActive();});
 el.addEventListener('pointerup',()=>{drag=null;});
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1,0); if(e.key==='ArrowRight')move(1,0); if(e.key==='ArrowDown')move(0,1); if(e.key===' ')place();});
window.addEventListener('resize', ()=>{resizeFx(); fitCell();});
fitCell(); renderSteps();
</script>
</body>
</html>
